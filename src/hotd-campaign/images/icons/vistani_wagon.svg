<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Wagon body -->
  <rect x="10" y="24" width="40" height="18" rx="3" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <!-- Canopy/arch top -->
  <path d="M8 26 Q30 2 56 26" fill="#C0392B" stroke="#922B21" stroke-width="1.5"/>
  <!-- Canopy ribs -->
  <path d="M18 24 Q30 10 46 24" fill="none" stroke="#E8B923" stroke-width="0.8" opacity="0.7"/>
  <path d="M13 25 Q30 6 51 25" fill="none" stroke="#E8B923" stroke-width="0.8" opacity="0.5"/>
  <!-- Side detail / window -->
  <rect x="22" y="28" width="10" height="8" rx="1.5" fill="#F4D03F" opacity="0.85" stroke="#8B4513" stroke-width="0.8"/>
  <line x1="27" y1="28" x2="27" y2="36" stroke="#8B4513" stroke-width="0.6"/>
  <line x1="22" y1="32" x2="32" y2="32" stroke="#8B4513" stroke-width="0.6"/>
  <!-- Side decorative dots -->
  <circle cx="16" cy="33" r="1.5" fill="#E8B923"/>
  <circle cx="38" cy="33" r="1.5" fill="#E8B923"/>
  <circle cx="44" cy="33" r="1.5" fill="#E8B923"/>
  <!-- Wagon tongue/hitch -->
  <line x1="5" y1="40" x2="12" y2="36" stroke="#5C2E0A" stroke-width="2" stroke-linecap="round"/>
  <!-- Axle -->
  <line x1="18" y1="42" x2="46" y2="42" stroke="#3E2009" stroke-width="2"/>
  <!-- Left wheel -->
  <circle cx="18" cy="46" r="8" fill="none" stroke="#5C2E0A" stroke-width="2.5"/>
  <circle cx="18" cy="46" r="3" fill="#3E2009"/>
  <line x1="18" y1="38" x2="18" y2="54" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="10" y1="46" x2="26" y2="46" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="12.3" y1="40.3" x2="23.7" y2="51.7" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="23.7" y1="40.3" x2="12.3" y2="51.7" stroke="#5C2E0A" stroke-width="1"/>
  <!-- Right wheel -->
  <circle cx="46" cy="46" r="8" fill="none" stroke="#5C2E0A" stroke-width="2.5"/>
  <circle cx="46" cy="46" r="3" fill="#3E2009"/>
  <line x1="46" y1="38" x2="46" y2="54" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="38" y1="46" x2="54" y2="46" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="40.3" y1="40.3" x2="51.7" y2="51.7" stroke="#5C2E0A" stroke-width="1"/>
  <line x1="51.7" y1="40.3" x2="40.3" y2="51.7" stroke="#5C2E0A" stroke-width="1"/>
  <!-- Hanging lantern -->
  <line x1="50" y1="24" x2="52" y2="20" stroke="#8B4513" stroke-width="0.8"/>
  <circle cx="52" cy="18" r="2.5" fill="#F39C12" opacity="0.9"/>
  <circle cx="52" cy="18" r="1" fill="#FFF" opacity="0.6"/>
</svg>
