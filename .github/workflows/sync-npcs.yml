name: Sync NPCs to Database

on:
  push:
    branches: [main]
    paths:
      - 'src/hotd-campaign/data/npcs.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB changes)'
        type: boolean
        default: false

env:
  PGHOST: localhost
  PGPORT: "30432"
  PGUSER: cortana
  PGDATABASE: dnd_website

jobs:
  sync:
    name: Sync npcs.json → Database
    runs-on: [self-hosted, linux, cortana]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd scripts
          npm init -y --silent 2>/dev/null || true
          npm install pg --no-save --silent

      - name: Validate npcs.json
        run: node -e "const d=JSON.parse(require('fs').readFileSync('src/hotd-campaign/data/npcs.json','utf8')); console.log('Valid JSON:', d.length, 'NPCs'); if(!d.length) process.exit(1);"

      - name: Sync NPCs
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          FLAGS=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            FLAGS="--dry-run"
          fi
          node scripts/sync-npcs.js $FLAGS
