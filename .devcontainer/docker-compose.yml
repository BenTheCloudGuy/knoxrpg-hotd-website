version: "3.8"

services:
  # ── Dev Container (Node.js app) ─────────────────────────────────────────────
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/knoxrpg-hotd-website:cached
    command: sleep infinity
    ports:
      - "30000:30000"
    environment:
      # PostgreSQL connection — mirrors cortana/prod config
      PGHOST: db
      PGPORT: "5432"
      PGUSER: cortana
      PGPASSWORD: cortana_dev
      PGDATABASE: dnd_website
      # Azure service principal for CLI auto-login (set via Codespaces secrets or host env)
      AZURE_TENANT: ${AZURE_TENANT:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_SECRET: ${AZURE_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      POSTGRES_USER: cortana
      POSTGRES_PASSWORD: cortana_dev
      POSTGRES_DB: dnd_website
    ports:
      - "5432:5432"

volumes:
  pgdata:
