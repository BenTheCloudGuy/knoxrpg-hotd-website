{{- /*
  Optional Secret holding application-level plaintext values (OpenAI API key).
  Rendered only when the inline value is configured AND the operator has not
  pointed at their own Secret. Operators may pre-create their own Secrets and
  set `*.existingSecret` to override per-key.
*/ -}}
{{- $needOpenAI := and .Values.openai.apiKey (not .Values.openai.existingSecret) -}}
{{- if $needOpenAI }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hotd-website.fullname" . }}-app-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-website.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.openai.apiKey | quote }}
{{- end }}
