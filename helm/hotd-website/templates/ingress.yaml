{{- if .Values.ingress.enabled }}
{{- $annotations := .Values.ingress.annotations | default dict -}}
{{- if .Values.ingress.blockMetricsAtIngress }}
{{- $snippet := "location = /metrics { deny all; return 404; }\nlocation ^~ /metrics/ { deny all; return 404; }" -}}
{{- $annotations = merge (dict "nginx.ingress.kubernetes.io/server-snippet" $snippet) $annotations -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotd-website
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-website.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotd-website
                port:
                  number: 3000
{{- end }}
