{{- /*
  Optional Secret holding the Postgres password (and other plaintext values)
  so the Deployment can reference them via secretKeyRef instead of exposing
  them as plain env vars in the Pod spec.

  Skipped if the operator provides their own Secret via
  .Values.postgres.existingSecret.
*/ -}}
{{- if and .Values.postgres.password (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hotd-website.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-website.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
{{- end }}
