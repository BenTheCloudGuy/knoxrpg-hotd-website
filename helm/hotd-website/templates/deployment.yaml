apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotd-website
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hotd-website.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.hostNetwork }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "hotd-website.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.hostNetwork | default false }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        {{- if .Values.arcIdentity.enabled }}
        supplementalGroups: [984]
        {{- end }}
      containers:
        - name: hotd-website
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: HOTD_CONTENT_DIR
              value: "/data/hotd-content"
            - name: STORAGE_ACCOUNT_NAME
              value: {{ .Values.storage.accountName | quote }}
            - name: KEY_VAULT_NAME
              value: {{ .Values.keyVault.name | quote }}
            - name: OPENAI_KV_SECRET_NAME
              value: {{ .Values.keyVault.openaiSecretName | quote }}
            {{- if .Values.openai.apiKey }}
            - name: OPENAI_API_KEY
              value: {{ .Values.openai.apiKey | quote }}
            {{- end }}
            {{- if .Values.appInsights.connectionString }}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{ .Values.appInsights.connectionString | quote }}
            {{- end }}
            - name: APPINSIGHTS_KV_SECRET_NAME
              value: {{ .Values.appInsights.kvSecretName | quote }}
            {{- if .Values.arcIdentity.enabled }}
            - name: IDENTITY_ENDPOINT
              value: "http://localhost:40342/metadata/identity/oauth2/token"
            - name: IMDS_ENDPOINT
              value: "http://localhost:40342"
            {{- end }}
          volumeMounts:
            - name: hotd-content
              mountPath: /data/hotd-content
              readOnly: true
            - name: notebook-images
              mountPath: {{ .Values.notebookImages.mountPath }}
            {{- if .Values.arcIdentity.enabled }}
            - name: arc-tokens
              mountPath: /var/opt/azcmagent/tokens
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
      volumes:
        - name: hotd-content
          hostPath:
            path: {{ .Values.nas.hotdContent }}
            type: Directory
        - name: notebook-images
          persistentVolumeClaim:
            claimName: hotd-notebook-images
        {{- if .Values.arcIdentity.enabled }}
        - name: arc-tokens
          hostPath:
            path: /var/opt/azcmagent/tokens
            type: Directory
        {{- end }}
