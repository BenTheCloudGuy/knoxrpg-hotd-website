apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotd-website
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hotd-website.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.hostNetwork }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "hotd-website.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.hostNetwork | default false }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: hotd-website
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
            {{- if .Values.observability.metrics.enabled }}
            - containerPort: {{ .Values.observability.metrics.port }}
              name: metrics
            {{- end }}
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres" (include "hotd-website.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKey | default "password" }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: HOTD_CONTENT_DIR
              value: "/data/hotd-content"
            - name: STORAGE_ACCOUNT_NAME
              value: {{ .Values.storage.accountName | quote }}
            {{- if or .Values.openai.apiKey .Values.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.existingSecret | default (printf "%s-app-secrets" (include "hotd-website.fullname" .)) }}
                  key: {{ .Values.openai.existingSecretKey | default "openai-api-key" }}
            {{- end }}
            - name: HOTD_REPO_ROOT
              value: "/app"
            - name: HOTD_PDF_SCRIPT
              value: {{ .Values.reports.pdfScript | quote }}
            - name: HOTD_REPORTS_DIR
              value: {{ .Values.reports.mountPath | quote }}
            # ── Observability ───────────────────────────────────────
            {{- if .Values.observability.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: {{ .Values.observability.metrics.port | quote }}
            - name: METRICS_BIND_ADDR
              value: {{ .Values.observability.metrics.bindAddr | quote }}
            {{- else }}
            - name: METRICS_ENABLED
              value: "false"
            {{- end }}
            {{- if .Values.observability.logs.format }}
            - name: HOTD_LOG_FORMAT
              value: {{ .Values.observability.logs.format | quote }}
            {{- end }}
            {{- if and .Values.observability.loki.enabled .Values.observability.loki.pushUrl }}
            - name: LOKI_PUSH_URL
              value: {{ .Values.observability.loki.pushUrl | quote }}
            {{- if .Values.observability.loki.extraLabels }}
            - name: LOKI_LABELS_JSON
              value: {{ .Values.observability.loki.extraLabels | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.observability.tracing.enabled .Values.observability.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.tracing.serviceName | quote }}
            {{- end }}
            # Downward API for log labels (used by Loki shipper and any future
            # cluster log collector that joins kubernetes_sd metadata).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: hotd-content
              mountPath: /data/hotd-content
              readOnly: true
            - name: notebook-images
              mountPath: {{ .Values.notebookImages.mountPath }}
            - name: reports
              mountPath: {{ .Values.reports.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
      volumes:
        - name: hotd-content
          hostPath:
            path: {{ .Values.nas.hotdContent }}
            type: Directory
        - name: notebook-images
          persistentVolumeClaim:
            claimName: hotd-notebook-images
        - name: reports
          emptyDir:
            sizeLimit: {{ .Values.reports.sizeLimit }}
