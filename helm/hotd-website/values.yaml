# =============================================================================
# HotD Website - Helm Values
# =============================================================================

# -- Namespace ----------------------------------------------------------------
namespace: hotd-website
createNamespace: true

# -- Naming overrides ---------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Replicas -----------------------------------------------------------------
replicaCount: 1

# -- Container Image ----------------------------------------------------------
image:
  repository: localhost:32000/hotd-website
  tag: "1.0.0"
  pullPolicy: Always

# -- PostgreSQL (reuse AI stack's pgvector instance) --------------------------
# REQUIRED: Set postgres.password at deploy time via --set or a secrets file.
# The chart creates a Kubernetes Secret to hold the password so it is not
# exposed as a plain env var on the Pod. Alternatively, pre-create your own
# Secret and set `existingSecret` (and optionally `existingSecretKey`).
postgres:
  host: postgres-pgvector.ai.svc.cluster.local
  port: "5432"
  user: cortana
  password: ""               # REQUIRED — do NOT commit a real password here
  existingSecret: ""         # optional: name of a pre-existing Secret with the password
  existingSecretKey: "password"
  database: dnd_website

# -- NAS Content Paths --------------------------------------------------------
nas:
  hotdContent: /mnt/nas/Gaming/ASSETS/DDB_CONTENT/hotd-website-content

# -- Notebook Images (PVC) ----------------------------------------------------
notebookImages:
  size: 2Gi
  storageClass: microk8s-hostpath
  mountPath: /app/hotd-campaign/images/notebook

# -- Reports (PDF output, ephemeral) ------------------------------------------
# PDFs are regenerable from the markdown stored in `hotd_sessions`, so an
# emptyDir is sufficient. Bump sizeLimit if the DM keeps a backlog of large
# generated guides.
reports:
  mountPath: /app/reports
  sizeLimit: 512Mi
  pdfScript: /app/scripts/build-session-pdf.js

# -- OpenAI -------------------------------------------------------------------
# If `apiKey` is set, the chart renders an Opaque Secret and the Deployment
# reads OPENAI_API_KEY via secretKeyRef. To use a pre-existing Secret instead,
# leave `apiKey` empty and set `existingSecret` (and optionally `existingSecretKey`).
openai:
  apiKey: ""                 # Optional fallback, managed identity preferred
  # Fallback secret used when Arc managed identity cannot reach Key Vault
  # (e.g. cert rotation issue). Provision with:
  #   az keyvault secret show --vault-name cloudgeek-cus-keyvault \
  #     --name openai-api-key --query value -o tsv \
  #     | kubectl create secret generic openai-api-key \
  #         -n hotd-website --from-literal=openai-api-key=-
  existingSecret: "openai-api-key"
  existingSecretKey: "openai-api-key"

# -- Azure Arc Managed Identity -----------------------------------------------
arcIdentity:
  enabled: true              # Enable Arc managed identity for KV + Storage

# -- Azure Storage Account ----------------------------------------------------
storage:
  accountName: cloudgeekcusgaming01

# -- Azure Key Vault -----------------------------------------------------------
keyVault:
  name: cloudgeek-cus-keyvault
  openaiSecretName: openai-api-key

# -- Host Network (required for Arc identity) ----------------------------------
hostNetwork: true

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  host: hotd.knoxrpg.com
  tls:
    secretName: tls-hotd-website
  # /metrics is served on a SEPARATE port (:9464) that the public ingress never
  # routes to (backend is :3000). Leaving this on injects a server-snippet
  # annotation, which recent nginx-ingress builds reject as risky and drop the
  # whole Ingress (causing fallback to the controller's fake TLS cert). Keep
  # off unless you also pin a controller that allows the snippet.
  blockMetricsAtIngress: false

# -- Observability ------------------------------------------------------------
# Application instrumentation. The metrics listener binds on a SEPARATE port
# (default :9464) so /metrics never travels through the public ingress. The
# pod runs hostNetwork: true (Arc identity requirement), so the port is
# reachable on the cortana host IP at the same number.
#
# Loki shipping is an opt-in transitional path: until a cluster-wide log
# collector (Grafana Alloy / Promtail DaemonSet) ships, the app pushes
# JSON log lines directly to Loki when LOKI_PUSH_URL is set.
observability:
  metrics:
    enabled: true
    port: 9464
    bindAddr: "0.0.0.0"
  logs:
    # "json" emits one JSON object per line on stdout (Alloy / Promtail can
    # parse it with the json pipeline stage). Empty keeps the legacy shape.
    format: "json"
  loki:
    # Set pushUrl to enable in-process push. Recommended only until a
    # cluster log collector exists. Default off so dev installs stay quiet.
    enabled: false
    pushUrl: ""
    # Extra labels merged into the stream. namespace + pod are added
    # automatically from the downward API.
    extraLabels: {}
  tracing:
    # When endpoint is set, the app starts an OTLP/HTTP trace exporter on boot.
    # Requires @opentelemetry/sdk-node + auto-instrumentations to be installed;
    # disabled (no-op) otherwise. Wire Grafana Tempo when ready.
    enabled: false
    endpoint: ""
    serviceName: "hotd-website"

# -- Resources ----------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

# -- Security Context ---------------------------------------------------------
securityContext:
  runAsUser: 1000
  fsGroup: 1000

# -- Probes -------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 30
