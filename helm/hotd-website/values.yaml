# =============================================================================
# HotD Website - Helm Values
# =============================================================================

# -- Namespace ----------------------------------------------------------------
namespace: hotd-website
createNamespace: true

# -- Naming overrides ---------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Replicas -----------------------------------------------------------------
replicaCount: 1

# -- Container Image ----------------------------------------------------------
image:
  repository: localhost:32000/hotd-website
  tag: "1.0.0"
  pullPolicy: Always

# -- PostgreSQL (reuse AI stack's pgvector instance) --------------------------
# REQUIRED: Set postgres.password at deploy time via --set or a secrets file.
postgres:
  host: postgres-pgvector.ai.svc.cluster.local
  port: "5432"
  user: cortana
  password: ""               # REQUIRED — do NOT commit a real password here
  database: dnd_website

# -- NAS Content Paths --------------------------------------------------------
nas:
  hotdContent: /mnt/nas/Gaming/ASSETS/DDB_CONTENT/hotd-website-content

# -- Notebook Images (PVC) ----------------------------------------------------
notebookImages:
  size: 2Gi
  storageClass: microk8s-hostpath
  mountPath: /app/hotd-campaign/images/notebook

# -- OpenAI -------------------------------------------------------------------
openai:
  apiKey: ""                 # Optional fallback — managed identity preferred

# -- Azure Arc Managed Identity -----------------------------------------------
arcIdentity:
  enabled: true              # Enable Arc managed identity for KV + Storage

# -- Azure Storage Account ----------------------------------------------------
storage:
  accountName: cloudgeekcusgaming01

# -- Azure Key Vault -----------------------------------------------------------
keyVault:
  name: cloudgeek-cus-keyvault
  openaiSecretName: openai-api-key

# -- Application Insights ------------------------------------------------------
appInsights:
  connectionString: ""   # Set via --set or loaded from Key Vault at startup
  kvSecretName: appinsights-connection-string

# -- Host Network (required for Arc identity) ----------------------------------
hostNetwork: true

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  host: hotd.knoxrpg.com
  tls:
    secretName: tls-hotd-website

# -- Resources ----------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

# -- Security Context ---------------------------------------------------------
securityContext:
  runAsUser: 1000
  fsGroup: 1000

# -- Probes -------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 30
