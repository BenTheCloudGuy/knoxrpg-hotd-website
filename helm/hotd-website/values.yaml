# =============================================================================
# HotD Website - Helm Values
# =============================================================================

# -- Namespace ----------------------------------------------------------------
namespace: hotd-website
createNamespace: true

# -- Naming overrides ---------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Replicas -----------------------------------------------------------------
replicaCount: 1

# -- Container Image ----------------------------------------------------------
image:
  repository: localhost:32000/hotd-website
  tag: "1.0.0"
  pullPolicy: Always

# -- Rollout trigger ----------------------------------------------------------
# Set to a unique value per deploy (the deploy workflow passes the git SHA).
# It is rendered as a pod-template annotation so `helm upgrade` always produces
# a changed Deployment spec, forcing a rolling restart even when image.tag is
# unchanged. Prevents the "reused version tag -> no-op deploy" footgun.
rolloutTrigger: ""

# -- Extra pod annotations (optional) -----------------------------------------
podAnnotations: {}

# -- PostgreSQL (reuse AI stack's pgvector instance) --------------------------
# REQUIRED: Set postgres.password at deploy time via --set or a secrets file.
# The chart creates a Kubernetes Secret to hold the password so it is not
# exposed as a plain env var on the Pod. Alternatively, pre-create your own
# Secret and set `existingSecret` (and optionally `existingSecretKey`).
postgres:
  host: postgres-pgvector.ai.svc.cluster.local
  port: "5432"
  user: cortana
  password: ""               # REQUIRED — do NOT commit a real password here
  existingSecret: ""         # optional: name of a pre-existing Secret with the password
  existingSecretKey: "password"
  database: dnd_website

# -- NAS Content Paths --------------------------------------------------------
nas:
  hotdContent: /mnt/nas/Gaming/ASSETS/DDB_CONTENT/hotd-website-content

# -- Notebook Images (PVC) ----------------------------------------------------
notebookImages:
  size: 2Gi
  storageClass: microk8s-hostpath
  mountPath: /app/hotd-campaign/images/notebook

# -- Uploads (PVC, writable overlay over the NAS hostPath) --------------------
# User-uploaded assets (NPC portraits, art, artifacts, handouts, maps, plus
# DALL-E image-studio outputs) land here. The application overlay-reads the
# `/hotd-content/*` URL space: writes always go to this PVC, reads check the
# PVC first and fall back to the read-only NAS hostPath. This keeps shipped
# legacy assets in the NAS and lets uploads succeed without making the NAS
# RW. Bump `size` if the campaign accumulates more user uploads.
uploads:
  size: 5Gi
  storageClass: microk8s-hostpath
  mountPath: /data/hotd-uploads

# -- Reports (PDF output, ephemeral) ------------------------------------------
# PDFs are regenerable from the markdown stored in `hotd_sessions`, so an
# emptyDir is sufficient. Bump sizeLimit if the DM keeps a backlog of large
# generated guides.
reports:
  mountPath: /app/reports
  sizeLimit: 512Mi
  pdfScript: /app/scripts/build-session-pdf.js

# -- OpenAI -------------------------------------------------------------------
# Provision the API key as a Kubernetes Secret in the release namespace.
# Either inline `apiKey` (renders an Opaque Secret) or pre-create your own
# Secret and point `existingSecret` at it. Provisioning example:
#   kubectl create secret generic openai-api-key \
#     -n hotd-website --from-literal=openai-api-key=sk-...
openai:
  apiKey: ""
  existingSecret: "openai-api-key"
  existingSecretKey: "openai-api-key"

# -- Azure Key Vault (DMCC secret/key/cert management) ------------------------
# The website/DMCC layer (NOT the dnd-rag backend) uses a service principal to
# read/write Key Vault secrets/keys/certs (e.g. the DDB cobalt token). Pre-create
# the Secret with the SP credentials, then point `existingSecret` at it:
#   kubectl create secret generic hotd-website-azure-sp -n hotd-website \
#     --from-literal=azure-client-id=<appId> \
#     --from-literal=azure-client-secret=<password> \
#     --from-literal=azure-tenant-id=<tenant> \
#     --from-literal=azure-keyvault-name=cloudgeek-cus-keyvault
# Keys expected in the Secret: azure-client-id, azure-client-secret,
# azure-tenant-id, azure-keyvault-name.
azure:
  enabled: true
  existingSecret: "hotd-website-azure-sp"

# -- Storage URL rewriting ----------------------------------------------------
# Legacy `<account>.blob.core.windows.net` URLs in the DB are rewritten on
# read to the current storage host (and to /hotd-content/ in dev when
# nas.hotdContent is mounted). The chart no longer talks to Azure Storage.
storage:
  accountName: cloudgeekcusgaming01

# -- Host Network -------------------------------------------------------------
# Keeps the metrics port (:9464) reachable directly on the cortana host IP
# for the UnRAID Prometheus scrape (192.168.10.210:9464). Set false to bind
# inside the pod network instead; an external scrape then needs a Service.
hostNetwork: true

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  host: hotd.knoxrpg.com
  tls:
    secretName: tls-hotd-website
  # /metrics is served on a SEPARATE port (:9464) that the public ingress never
  # routes to (backend is :3000). Leaving this on injects a server-snippet
  # annotation, which recent nginx-ingress builds reject as risky and drop the
  # whole Ingress (causing fallback to the controller's fake TLS cert). Keep
  # off unless you also pin a controller that allows the snippet.
  blockMetricsAtIngress: false

# -- Observability ------------------------------------------------------------
# Application instrumentation. The metrics listener binds on a SEPARATE port
# (default :9464) so /metrics never travels through the public ingress. When
# hostNetwork is true (default) the port is reachable directly on the
# cortana host IP at the same number.
#
# Loki shipping is an opt-in transitional path: until a cluster-wide log
# collector (Grafana Alloy / Promtail DaemonSet) ships, the app pushes
# JSON log lines directly to Loki when LOKI_PUSH_URL is set.
observability:
  metrics:
    enabled: true
    port: 9464
    bindAddr: "0.0.0.0"
  logs:
    # "json" emits one JSON object per line on stdout (Alloy / Promtail can
    # parse it with the json pipeline stage). Empty keeps the legacy shape.
    format: "json"
  loki:
    # Set pushUrl to enable in-process push. Recommended only until a
    # cluster log collector exists. Default off so dev installs stay quiet.
    enabled: false
    pushUrl: ""
    # Extra labels merged into the stream. namespace + pod are added
    # automatically from the downward API.
    extraLabels: {}
  tracing:
    # When endpoint is set, the app starts an OTLP/HTTP trace exporter on boot.
    # Requires @opentelemetry/sdk-node + auto-instrumentations to be installed;
    # disabled (no-op) otherwise. Wire Grafana Tempo when ready.
    enabled: false
    endpoint: ""
    serviceName: "hotd-website"

# -- Resources ----------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2"
    memory: "1Gi"

# -- Security Context ---------------------------------------------------------
securityContext:
  runAsUser: 1000
  fsGroup: 1000

# -- Probes -------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 30
