{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundryvtt-game
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-foundry.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.instance.fqdn }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.instance.fqdn }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foundryvtt
                port:
                  number: {{ .Values.service.gamePort }}
{{- end }}
