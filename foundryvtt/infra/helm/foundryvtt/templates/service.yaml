apiVersion: v1
kind: Service
metadata:
  name: foundryvtt
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-foundry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hotd-foundry.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.service.gamePort }}
      targetPort: game
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.gameNodePort }}
      {{- end }}
