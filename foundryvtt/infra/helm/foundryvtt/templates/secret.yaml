{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: foundry-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hotd-foundry.labels" . | nindent 4 }}
type: Opaque
stringData:
  license-key: {{ .Values.secrets.licenseKey | quote }}
  admin-key: {{ .Values.secrets.adminKey | quote }}
{{- end }}
